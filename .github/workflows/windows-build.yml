name: Windows build and security tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install installer compiler
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar NSIS.' }
          }
      - name: Compile and test
        shell: powershell
        run: .\build.ps1
      - name: Render demonstration
        shell: powershell
        run: |
          $process = Start-Process '.\artifacts\portable\ToccatoDesktopManager.exe' -ArgumentList '--screenshot', "$PWD\artifacts\TDM-1.0.0-preview.png" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path '.\artifacts\TDM-1.0.0-preview.png')) { throw 'Falha na captura da interface.' }
      - name: Verify per-user installer and preservation of vault files
        shell: powershell
        run: |
          $target = Join-Path $env:TEMP 'TDM Install Test'
          $process = Start-Process '.\artifacts\ToccatoDesktopManager-1.0.0-Setup.exe' -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$target\ToccatoDesktopManager.exe")) { throw 'Falha no instalador silencioso.' }
          Set-Content "$target\preservar.tdmv" 'synthetic sentinel - no credentials'
          $process = Start-Process "$target\Desinstalar.exe" -ArgumentList '/S', "_?=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$target\ToccatoDesktopManager.exe") -or -not (Test-Path "$target\preservar.tdmv")) { throw 'A desinstalação não preservou o arquivo do usuário.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ToccatoDesktopManager-1.0.0-Windows
          if-no-files-found: error
          path: |
            artifacts/ToccatoDesktopManager-1.0.0-Setup.exe
            artifacts/ToccatoDesktopManager-1.0.0-Portable.zip
            artifacts/SHA256SUMS_1_0_0.txt
            artifacts/TDM-1.0.0-preview.png
